# Garden & Grace — Public Edition
# The Good Neighbor Guard
# Built by Christopher Hughes · Sacramento, CA
# Truth · Safety · We Got Your Back

services:
  - type: web
    name: garden-and-grace-public
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn backend.main:app --worker-class uvicorn.workers.UvicornWorker --timeout 120 --workers 1 --preload
    envVars:
      # ── AI ───────────────────────────────────────────────
      - key: ANTHROPIC_API_KEY
        sync: false
      # ── App ──────────────────────────────────────────────
      - key: APP_URL
        sync: false           # e.g. https://garden-and-grace-public.onrender.com
      - key: ENV
        value: production
      - key: DB_PATH
        value: /var/data/garden_grace_public.db
      - key: FREE_DAILY_LIMIT
        value: "5"
      # ── Supabase Auth ────────────────────────────────────
      - key: SUPABASE_URL
        sync: false           # https://<project-ref>.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false           # public anon key (safe in browser)
      - key: SUPABASE_JWT_SECRET
        sync: false           # used to verify JWTs server-side
      # ── Stripe Billing ───────────────────────────────────
      - key: STRIPE_SECRET_KEY
        sync: false           # sk_live_... or sk_test_...
      - key: STRIPE_WEBHOOK_SECRET
        sync: false           # whsec_...
      - key: STRIPE_PRICE_ID
        sync: false           # price_... (premium subscription)
    disk:
      name: garden-grace-public-data
      mountPath: /var/data
      sizeGB: 1
